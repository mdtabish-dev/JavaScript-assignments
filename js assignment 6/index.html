// Question no 13

var m = prompt(`Enter your name : `)
if(m.indexOf("@") !== -1 ||m.indexOf(".") !== -1 ||m.indexOf(",") !== -1 ||m.indexOf("!") !== -1){
    alert("Invalid username! Please enter a username without @ . , !");
}
else {
    alert("Welcome, "+m);
}
document.write("<hr>")

// Question no 14

var A = ["cake", "apple pie", "cookie", "chips", "patties"];
var userInput = prompt("Welcome to ABC Bakery. What do you want to order sir/ma'am?");
userInput = userInput.toLowerCase();
for (var i =0; i<A.length; i++){
    if(A[i] === userInput){
        document.write(`<p>${userInput} is available at index ${i} in our bakery</p>`);
        break;
    }
}
if(i === A.length){
    document.write(`<p>We are sorry. ${userInput} is not available in our bakery</p>`);
}
document.write("<hr>")

// Question no 15

var password = prompt("Enter password : ");

if(password.length >= 6&&  !(password[0]>="0"&&password[0]<="9")&& /[a-zA-Z]/.test(password)&&/[0-9]/.test(password)){
    alert("Password accepted!");
} 
else {
    alert("Invalid password! Must be at least 6 characters, start with a letter, and contain letters and numbers.");
}
document.write("<hr>")

// Question no 18

var para = "The quick brown fox jumps over the lazy dog";
var lowerStr = para.toLowerCase();
var words = lowerStr.split(" ");
var count = 0;
for (var i = 0; i < words.length; i++) {
    if (words[i] === "the") {
        count++;
    }
}
document.write(`Text : ${para}<br>`)
document.write(`Number of occurrences of 'the': ${count}<br>`);
